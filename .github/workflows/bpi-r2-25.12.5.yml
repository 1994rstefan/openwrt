name: Build BPI-R2 25.12.5 firmware

on:
  push:
    tags:
      - "25.12.5-bpi_r2.*"

permissions:
  contents: write

concurrency:
  group: bpi-r2-25.12.5-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential clang flex bison g++ gawk gcc-multilib \
            g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-setuptools rsync swig unzip zlib1g-dev file wget

      - name: Install pinned release feeds
        run: |
          cat > feeds.conf <<'EOF'
          src-git packages https://git.openwrt.org/feed/packages.git^5caa62e0bc9f7fb9b0c12a23267bceb7724214dd
          src-git luci https://git.openwrt.org/project/luci.git^128a7812f4be233c5dd7f7466f534fd888785caf
          src-git routing https://git.openwrt.org/feed/routing.git^3d7d0dc7fa43d3eb09498417407e95a6552e5312
          src-git telephony https://git.openwrt.org/feed/telephony.git^2618106d5846a4a542fdf5809f0d3ed228ce439b
          src-git video https://github.com/openwrt/video.git^094bf58da6682f895255a35a84349a79dab4bf95
          EOF
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure BPI-R2 image
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            https://downloads.openwrt.org/releases/25.12.5/targets/mediatek/mt7623/config.buildinfo \
            --output official.config
          printf '%s  %s\n' \
            6092a235a6451e5425d00d5633b8528c4d242a0fa6ab3a3e554234d02c764ed2 \
            official.config | sha256sum --check --strict
          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_mt7623=y
          CONFIG_TARGET_mediatek_mt7623_DEVICE_bananapi_bpi-r2=y
          CONFIG_TARGET_ROOTFS_INITRAMFS=y
          CONFIG_TARGET_ROOTFS_SQUASHFS=y
          CONFIG_ALL_KMODS=y
          CONFIG_DEVEL=y
          CONFIG_IMAGEOPT=y
          CONFIG_VERSIONOPT=y
          CONFIG_VERSION_FILENAMES=y
          CONFIG_KERNEL_BUILD_DOMAIN="buildhost"
          CONFIG_KERNEL_BUILD_USER="builder"
          # CONFIG_KERNEL_KALLSYMS is not set
          # CONFIG_PACKAGE_i2c-tools is not set
          # CONFIG_PACKAGE_libi2c is not set
          EOF
          grep -E '^CONFIG_PACKAGE_[A-Za-z0-9_-]+=y$' official.config >> .config
          printf 'CONFIG_VERSION_NUMBER="%s"\n' "$GITHUB_REF_NAME" >> .config
          printf 'CONFIG_VERSION_CODE="r%s"\n' "${GITHUB_SHA:0:12}" >> .config
          printf '%s\n' 'CONFIG_VERSION_REPO="https://downloads.openwrt.org/releases/25.12.5"' >> .config
          make defconfig

      - name: Download sources
        run: make -j"$(nproc)" download

      - name: Build firmware
        run: make -j"$(nproc)" BUILD_LOG=1

      - name: Verify images and package set
        run: |
          set -euo pipefail
          shopt -s nullglob
          out=bin/targets/mediatek/mt7623
          sd_images=("$out"/*-bananapi_bpi-r2-sdcard.img.gz)
          sysupgrades=("$out"/*-bananapi_bpi-r2-squashfs-sysupgrade.itb)
          uboots=("$out"/*-bananapi_bpi-r2-u-boot.bin)
          manifests=("$out"/*.manifest)
          test "${#sd_images[@]}" -eq 1
          test "${#sysupgrades[@]}" -eq 1
          test "${#uboots[@]}" -eq 1
          test "${#manifests[@]}" -eq 1
          grep -Eq '^kmod-rtc-ds1307 - ' "${manifests[0]}"
          grep -Eq '^luci - ' "${manifests[0]}"
          grep -Eq '^luci-ssl - ' "${manifests[0]}"
          grep -Eq '^rpcd-mod-luci - ' "${manifests[0]}"
          grep -Eq '^uhttpd - ' "${manifests[0]}"
          grep -Eq '^uhttpd-mod-ubus - ' "${manifests[0]}"
          ! grep -Eq '^(i2c-tools|libi2c) - ' "${manifests[0]}"
          curl --fail --location --silent --show-error \
            https://downloads.openwrt.org/releases/25.12.5/targets/mediatek/mt7623/openwrt-25.12.5-mediatek-mt7623.manifest \
            --output official.manifest
          cat > bpi-r2-extra-packages <<'EOF'
          e2fsprogs
          kmod-ata-ahci
          kmod-ata-core
          kmod-hwmon-core
          kmod-i2c-core
          kmod-nls-base
          kmod-regmap-core
          kmod-regmap-i2c
          kmod-rtc-ds1307
          kmod-scsi-core
          kmod-usb-common
          kmod-usb-core
          kmod-usb-xhci-hcd
          kmod-usb-xhci-mtk
          kmod-usb3
          libblkid1
          libcomerr0
          libe2p2
          libext2fs2
          libf2fs6
          libpthread
          librt
          libss2
          libuuid1
          mkf2fs
          EOF
          cut -d' ' -f1 official.manifest | LC_ALL=C sort -u > expected-packages
          cat bpi-r2-extra-packages >> expected-packages
          LC_ALL=C sort -u -o expected-packages expected-packages
          cut -d' ' -f1 "${manifests[0]}" | LC_ALL=C sort -u > built-packages
          diff -u expected-packages built-packages
          cp bpi-r2-extra-packages version-exceptions
          printf '%s\n' fit-check-sign uboot-envtools >> version-exceptions
          awk 'NR == FNR { skip[$1] = 1; next } !($1 in skip)' \
            version-exceptions official.manifest > official-common-packages
          awk 'NR == FNR { skip[$1] = 1; next } !($1 in skip)' \
            version-exceptions "${manifests[0]}" > built-common-packages
          diff -u official-common-packages built-common-packages
          grep -Fx 'fit-check-sign - 2025.10-r4' "${manifests[0]}"
          grep -Fx 'uboot-envtools - 2025.10-r4' "${manifests[0]}"
          staging_dir/host/bin/mkimage -l "${sysupgrades[0]}" | tee fit-layout.txt
          grep -F 'mt7623n-bananapi-bpi-r2-ds3231' fit-layout.txt
          strings "${uboots[0]}" | grep -F 'bootconf=config-1'
          strings "${uboots[0]}" | grep -F 'bootconf_recovery=config-1'

      - name: Verify official kernel ABI
        run: |
          set -euo pipefail
          manifest=(bin/targets/mediatek/mt7623/*.manifest)
          curl --fail --location --silent --show-error \
            https://downloads.openwrt.org/releases/25.12.5/targets/mediatek/mt7623/openwrt-25.12.5-mediatek-mt7623.manifest \
            --output official.manifest
          built_kernel="$(grep '^kernel - ' "${manifest[0]}")"
          official_kernel="$(grep '^kernel - ' official.manifest)"
          printf 'Built:    %s\nOfficial: %s\n' "$built_kernel" "$official_kernel" | tee kernel-abi.txt
          test "$built_kernel" = "$official_kernel"

      - name: Collect release artifacts
        run: |
          set -euo pipefail
          mkdir release
          cp bin/targets/mediatek/mt7623/*-bananapi_bpi-r2-sdcard.img.gz release/
          cp bin/targets/mediatek/mt7623/*-bananapi_bpi-r2-squashfs-sysupgrade.itb release/
          (cd release && sha256sum -- * > sha256sums)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          OpenWrt 25.12.5 firmware for the Banana Pi BPI-R2.

          The installed package set follows the official OpenWrt 25.12.5 image and includes LuCI with HTTPS support.
          The SD card image contains the bootloader, recovery image and production root filesystem.
          The sysupgrade image updates an existing installation without replacing the bootloader.
          EOF
          assets=(release/*-sdcard.img.gz release/*-squashfs-sysupgrade.itb release/sha256sums)
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == *.rc-* ]]; then
            release_flags+=(--prerelease)
          fi
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md \
              "${release_flags[@]}" \
              --verify-tag
          fi

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bpi-r2-${{ github.ref_name }}-logs
          path: logs/
          if-no-files-found: ignore
          retention-days: 7
